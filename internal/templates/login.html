<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gobierno2Go - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-indigo-800 h-screen flex justify-center items-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-900 mb-2">Gobierno2Go</h1>
            <p class="text-gray-500 text-sm">Ingrese sus credenciales para acceder</p>
        </div>
        <form id="login-form" class="space-y-6">
            <div>
                <label for="login" class="block text-sm font-semibold text-gray-700 mb-2">Usuario</label>
                <input type="text" id="login" name="login" required autocomplete="username" placeholder="Ej: eosorio"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-900 text-white font-semibold rounded-lg hover:bg-blue-800 transition duration-200 cursor-pointer">
                Ingresar
            </button>
            <div id="error-msg" class="hidden mt-4 p-3 bg-red-50 text-red-600 border border-red-200 rounded-lg text-sm text-center"></div>
            <div id="success-msg" class="hidden mt-4 p-3 bg-green-50 text-green-600 border border-green-200 rounded-lg text-sm text-center"></div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/v1/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    successDiv.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
                    successDiv.classList.remove('hidden');
                    setTimeout(() => { window.location.href = data.redirect || '/dashboard'; }, 800);
                } else {
                    errorDiv.textContent = data.message || 'Credenciales inválidas';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Error de conexión con el servidor';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
