{{define "content"}}
<h1 class="text-2xl font-bold text-slate-900 mb-6">Historial de Movimientos</h1>

<form method="get" action="/inventario/reportes/movimientos" class="mb-6 bg-white p-4 border border-gray-200 rounded-lg flex items-end space-x-4">
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Concepto</label>
        <select name="concepto" class="w-40 border border-gray-300 rounded px-3 py-1.5 text-sm">
            <option value="">-- Todos --</option>
            <option value="I" {{if eq .Concepto "I"}}selected{{end}}>Ingreso</option>
            <option value="T" {{if eq .Concepto "T"}}selected{{end}}>Traslado</option>
            <option value="B" {{if eq .Concepto "B"}}selected{{end}}>Baja</option>
        </select>
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Desde</label>
        <input type="date" name="desde" value="{{.Desde}}" class="w-40 border border-gray-300 rounded px-3 py-1.5 text-sm">
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Hasta</label>
        <input type="date" name="hasta" value="{{.Hasta}}" class="w-40 border border-gray-300 rounded px-3 py-1.5 text-sm">
    </div>
    <button type="submit" class="px-4 py-1.5 bg-slate-800 text-white rounded text-sm hover:bg-slate-900">Filtrar</button>
</form>

<div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200 text-sm">
        <thead class="bg-slate-50">
            <tr>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Fecha</th>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">N° Mov.</th>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Concepto</th>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Documento</th>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Usuario</th>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Bienes</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
            {{range .Movimientos}}
            <tr>
                <td class="px-4 py-3 text-gray-600">{{.Fecha.Format "02-01-2006"}}</td>
                <td class="px-4 py-3 font-mono text-xs text-gray-800">{{.NumMovi}}</td>
                <td class="px-4 py-3 font-medium text-gray-800">{{.ConceptoNombre}}</td>
                <td class="px-4 py-3 text-gray-600">{{.TipoDoc}} {{.NumDoc}}</td>
                <td class="px-4 py-3 text-gray-600 text-xs">{{.Usuario}}</td>
                <td class="px-4 py-3 text-gray-600 text-xs">{{.Bienes}}</td>
            </tr>
            {{else}}
            <tr>
                <td colspan="6" class="px-4 py-8 text-center text-gray-500">No se encontraron movimientos.</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
