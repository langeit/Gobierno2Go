{{define "content"}}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">{{if .Tipo.Codigo}}Modificar tipo de dominio{{else}}Ingreso de tipo de dominio{{end}}</h1>
    <p class="text-gray-600 text-sm">La descripción identifica al grupo de valores del catálogo.</p>
</div>

<form method="post" action="{{if .Tipo.Codigo}}/adquisiciones/mantenedores/tipos-dominio/{{.Tipo.Codigo}}{{else}}/adquisiciones/mantenedores/tipos-dominio/nuevo{{end}}" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm max-w-2xl">
    {{if .Tipo.Codigo}}
    <div class="mb-4">
        <p class="text-xs font-medium text-gray-500">Código</p>
        <p class="text-sm font-mono text-slate-800">{{.Tipo.Codigo}}</p>
    </div>
    {{end}}
    <div class="mb-6">
        <label class="block text-xs font-medium text-gray-700 mb-1" for="descripcion">Descripción *</label>
        <input id="descripcion" name="descripcion" type="text" required maxlength="100" value="{{.Descripcion}}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>
    <div class="flex items-center space-x-3">
        <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-sm transition">{{if .Tipo.Codigo}}Modificar{{else}}Guardar{{end}}</button>
        <a href="/adquisiciones/mantenedores/tipos-dominio" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-slate-700 text-sm font-semibold rounded-lg transition">Volver al listado</a>
    </div>
</form>
{{end}}
