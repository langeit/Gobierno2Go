{{define "content"}}
<div class="mb-6">
    <a href="/admin/perfiles" class="text-sm text-blue-600 hover:underline">← Volver a perfiles</a>
    <h1 class="text-2xl font-bold text-slate-900 mt-2">Editar perfil</h1>
</div>

<form method="post" action="/admin/perfiles/{{.Perfil.ID}}" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm max-w-3xl mb-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Nombre</label>
            <input type="text" name="nombre" required maxlength="80" value="{{.Perfil.Nombre}}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Descripción</label>
            <input type="text" name="descripcion" maxlength="200" value="{{.Perfil.Descripcion}}" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
    </div>
    <p class="text-xs font-medium text-gray-600 mb-2">Módulos</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-5">
        {{range .Modulos}}
        <label class="flex items-start space-x-2 text-sm text-gray-700">
            {{if and $.Perfil.Protegido (eq .Codigo "administracion")}}
            <input type="checkbox" checked disabled class="mt-1">
            <input type="hidden" name="modulos" value="administracion">
            {{else}}
            <input type="checkbox" name="modulos" value="{{.Codigo}}" class="mt-1" {{if $.Perfil.Tiene .Codigo}}checked{{end}}>
            {{end}}
            <span>
                <span class="font-medium">{{.Nombre}}</span>
                <span class="block text-xs text-gray-500">{{.Descripcion}}</span>
            </span>
        </label>
        {{end}}
    </div>
    {{if .Perfil.Protegido}}
    <p class="text-xs text-gray-500 mb-4">Este perfil está protegido: conserva el módulo de administración y no se puede eliminar.</p>
    {{end}}
    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">Guardar</button>
</form>

{{if not .Perfil.Protegido}}
<form method="post" action="/admin/perfiles/{{.Perfil.ID}}/eliminar" onsubmit="return confirm('¿Eliminar este perfil? Los usuarios asignados perderán estos accesos.');">
    <button type="submit" class="px-4 py-2 border border-red-300 text-red-700 rounded-lg text-sm font-semibold hover:bg-red-50">Eliminar perfil</button>
</form>
{{end}}
{{end}}
