{{define "content"}}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900">Ficha de Ingreso y Asignación de Correspondencia</h1>
    <p class="text-gray-600 text-sm mt-1">El correlativo se genera automáticamente según el centro generador y el año.</p>
</div>

<form method="post" action="/correspondencia/ingreso" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm space-y-5">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Tipo de documento *</label>
            <select name="tipo" required class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                <option value="">Seleccione...</option>
                {{range .Tipos}}<option value="{{.Codigo}}">{{.Descripcion}}</option>{{end}}
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Número de documento</label>
            <input type="number" name="numero" min="0" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Fecha del documento</label>
            <input type="date" name="fecha" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Origen</label>
            <select name="origen" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                <option value="">Seleccione...</option>
                {{range .Origenes}}<option value="{{.Codigo}}">{{.Descripcion}}</option>{{end}}
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Otro origen</label>
            <input type="text" name="origen2" maxlength="50" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
    </div>

    <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Referencia</label>
        <textarea name="referencia" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Acción</label>
            <select name="accion" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                <option value="">Seleccione...</option>
                {{range .Acciones}}<option value="{{.Codigo}}">{{.Descripcion}}</option>{{end}}
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Enviar a (opcional)</label>
            <select name="destino" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                <option value="">Queda en mi poder</option>
                {{range .Destinos}}<option value="{{.Value}}">{{.Label}} — {{.Group}}</option>{{end}}
            </select>
        </div>
    </div>

    <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Notas</label>
        <textarea name="notas" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
    </div>

    <div class="flex justify-end space-x-3 pt-4 border-t">
        <a href="/correspondencia" class="px-4 py-2 bg-gray-200 text-gray-700 font-semibold text-sm rounded-lg hover:bg-gray-300 transition">Cancelar</a>
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold text-sm rounded-lg hover:bg-blue-700 transition">Registrar documento</button>
    </div>
</form>
{{end}}
