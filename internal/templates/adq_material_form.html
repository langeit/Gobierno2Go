{{define "content"}}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">{{if .Material.Codigo}}Modificar material{{else}}Ingreso de material{{end}}</h1>
    <p class="text-gray-600 text-sm">El tipo corresponde a los dominios del grupo Tipo Material.</p>
</div>

<form method="post" action="{{if .Material.Codigo}}/adquisiciones/mantenedores/materiales/{{.Material.Codigo}}{{else}}/adquisiciones/mantenedores/materiales/nuevo{{end}}" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm max-w-2xl space-y-4">
    {{if .Material.Codigo}}
    <div>
        <p class="text-xs font-medium text-gray-500">Código</p>
        <p class="text-sm font-mono text-slate-800">{{.Material.Codigo}}</p>
    </div>
    {{end}}
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1" for="nombre">Nombre *</label>
        <input id="nombre" name="nombre" type="text" required maxlength="100" value="{{.Material.Nombre}}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1" for="tipo">Tipo de material *</label>
        <select id="tipo" name="tipo" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="">Seleccione</option>
            {{range .TiposMaterial}}
            <option value="{{.Codigo}}" {{if eq .Codigo $.Material.Tipo}}selected{{end}}>{{.Descripcion}}</option>
            {{end}}
        </select>
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1" for="stock">Stock crítico *</label>
        <input id="stock" name="stock" type="number" min="0" required value="{{.Material.StockCritico}}" class="w-40 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>
    <div class="flex items-center space-x-3 pt-2">
        <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-sm transition">{{if .Material.Codigo}}Modificar{{else}}Guardar{{end}}</button>
        <a href="/adquisiciones/mantenedores/materiales" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-slate-700 text-sm font-semibold rounded-lg transition">Volver al listado</a>
    </div>
</form>
{{end}}
