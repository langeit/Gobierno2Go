{{define "content"}}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">{{if .Asignacion.Correlativo}}Modificar asignación{{else}}Ingreso de asignación{{end}}</h1>
    <p class="text-gray-600 text-sm">El código admite hasta 20 caracteres y la descripción hasta 200.</p>
</div>

<form method="post" action="{{if .Asignacion.Correlativo}}/adquisiciones/mantenedores/asignaciones/{{.Asignacion.Correlativo}}{{else}}/adquisiciones/mantenedores/asignaciones/nuevo{{end}}" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm max-w-2xl space-y-4">
    {{if .Asignacion.Correlativo}}
    <div>
        <p class="text-xs font-medium text-gray-500">Correlativo</p>
        <p class="text-sm font-mono text-slate-800">{{.Asignacion.Correlativo}}</p>
    </div>
    {{end}}
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1" for="codigo">Código *</label>
        <input id="codigo" name="codigo" type="text" required maxlength="20" value="{{.Asignacion.Codigo}}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-700 mb-1" for="descripcion">Descripción *</label>
        <input id="descripcion" name="descripcion" type="text" required maxlength="200" value="{{.Asignacion.Descripcion}}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>
    <div class="flex items-center space-x-3 pt-2">
        <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-sm transition">{{if .Asignacion.Correlativo}}Modificar{{else}}Guardar{{end}}</button>
        <a href="/adquisiciones/mantenedores/asignaciones" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-slate-700 text-sm font-semibold rounded-lg transition">Volver al listado</a>
    </div>
</form>
{{end}}
