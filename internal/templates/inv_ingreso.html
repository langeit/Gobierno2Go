{{define "content"}}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-slate-900">Ingreso de Bienes</h1>
    <span class="text-sm text-gray-500">Santiago, {{.Fecha}}</span>
</div>

<form method="post" action="/inventario/ingreso" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-b border-gray-100 pb-6">
        <div>
            <h3 class="text-sm font-semibold text-slate-800 uppercase tracking-wider mb-3">Documento de Compra</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Tipo Documento</label>
                    <select name="tdocto_compra" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" required>
                        <option value="FA">Factura (FA)</option>
                        <option value="OP">Orden de pedido (OP)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Número Documento</label>
                    <input type="number" name="ndocto_compra" min="1" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" required>
                </div>
            </div>
        </div>
        <div>
            <h3 class="text-sm font-semibold text-slate-800 uppercase tracking-wider mb-3">Origen y Proveedor</h3>
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Tipo Doc. Origen</label>
                        <select name="tdocto_origen" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="RE">Resolución exenta (RE)</option>
                            <option value="OP">Orden de pedido (OP)</option>
                            <option value="ME">Memo (ME)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">N° Doc. Origen</label>
                        <input type="number" name="ndocto_origen" min="1" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">RUT Proveedor</label>
                    <input type="text" name="rut_proveedor" list="proveedores-list" maxlength="12" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Ej: 12.345.678-9" required>
                    <datalist id="proveedores-list">
                        {{range .Proveedores}}
                        <option value="{{.Codigo}}">{{.Descripcion}}</option>
                        {{end}}
                    </datalist>
                </div>
            </div>
        </div>
    </div>

    <div>
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-semibold text-slate-800 uppercase tracking-wider">Detalle de Bienes a Ingresar</h3>
            <button type="button" onclick="agregarFila()" class="px-3 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded text-xs font-semibold transition">+ Agregar Fila</button>
        </div>
        
        <div class="overflow-x-auto">
            <table class="min-w-full text-xs border border-gray-200" id="tabla-items">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-2 py-2 text-left font-semibold text-slate-700">Tipo de Bien</th>
                        <th class="px-2 py-2 text-left font-semibold text-slate-700">Descripción</th>
                        <th class="px-2 py-2 text-left font-semibold text-slate-700">Monto ($)</th>
                        <th class="px-2 py-2 text-left font-semibold text-slate-700">Zona</th>
                        <th class="px-2 py-2 text-left font-semibold text-slate-700">Piso</th>
                        <th class="px-2 py-2 text-left font-semibold text-slate-700">Oficina</th>
                        <th class="px-2 py-2 text-left font-semibold text-slate-700">Imputación</th>
                        <th class="px-2 py-2 text-left font-semibold text-slate-700">Fuente</th>
                        <th class="px-2 py-2"></th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100" id="tbody-items">
                    <tr class="item-row">
                        <td class="p-1">
                            <select name="tipo_bien[]" class="w-full border border-gray-300 rounded px-2 py-1" required>
                                <option value="">-- Tipo --</option>
                                {{range .TiposBien}}
                                <option value="{{.CorrTbien}}">{{.Descripcion}}</option>
                                {{end}}
                            </select>
                        </td>
                        <td class="p-1"><input type="text" name="descripcion[]" class="w-full border border-gray-300 rounded px-2 py-1" required></td>
                        <td class="p-1"><input type="number" step="0.01" min="0.01" name="monto[]" class="w-full border border-gray-300 rounded px-2 py-1" required></td>
                        <td class="p-1">
                            <select name="zona[]" class="w-full border border-gray-300 rounded px-2 py-1" required>
                                <option value="">-- Zona --</option>
                                {{range .Zonas}}
                                <option value="{{.CorrZona}}">{{.Descripcion}}</option>
                                {{end}}
                            </select>
                        </td>
                        <td class="p-1"><input type="text" name="piso[]" class="w-16 border border-gray-300 rounded px-2 py-1" required></td>
                        <td class="p-1"><input type="text" name="oficina[]" class="w-16 border border-gray-300 rounded px-2 py-1" required></td>
                        <td class="p-1">
                            <select name="imputacion[]" class="w-full border border-gray-300 rounded px-2 py-1" required>
                                <option value="">-- Imputación --</option>
                                {{range .Asignaciones}}
                                <option value="{{.Codigo}}">{{.Descripcion}}</option>
                                {{end}}
                            </select>
                        </td>
                        <td class="p-1"><input type="number" name="fuente[]" min="1" max="99" class="w-16 border border-gray-300 rounded px-2 py-1" value="1" required></td>
                        <td class="p-1 text-center">
                            <button type="button" onclick="eliminarFila(this)" class="text-red-500 hover:text-red-700 font-bold">×</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="flex justify-end pt-4 border-t border-gray-100">
        <button type="submit" class="px-6 py-2.5 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition">Registrar Ingreso</button>
    </div>
</form>

<script>
function agregarFila() {
    const tbody = document.getElementById('tbody-items');
    const firstRow = tbody.querySelector('.item-row');
    const newRow = firstRow.cloneNode(true);
    newRow.querySelectorAll('input').forEach(input => {
        if (input.name !== 'fuente[]') input.value = '';
    });
    newRow.querySelectorAll('select').forEach(select => select.selectedIndex = 0);
    tbody.appendChild(newRow);
}
function eliminarFila(btn) {
    const tbody = document.getElementById('tbody-items');
    if (tbody.querySelectorAll('.item-row').length > 1) {
        btn.closest('tr').remove();
    }
}
</script>
{{end}}
