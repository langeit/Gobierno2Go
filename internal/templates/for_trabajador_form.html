{{define "content"}}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">{{if .Trabajador}}Editar Trabajador{{else}}Nuevo Trabajador{{end}}</h1>
    <p class="text-gray-600 text-sm">Ingrese los datos personales y departamento del funcionario.</p>
</div>

<form method="post" action="{{if .Trabajador}}/formularios/admin/trabajadores/{{.Trabajador.IDEmpleado}}{{else}}/formularios/admin/trabajadores/nuevo{{end}}" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm max-w-2xl">
    <div class="space-y-4 mb-6">
        <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Nombre *</label>
            <input type="text" name="nombre" required maxlength="100" value="{{if .Trabajador}}{{.Trabajador.Nombre}}{{end}}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ej. Juan Carlos">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Apellido *</label>
            <input type="text" name="apellido" required maxlength="100" value="{{if .Trabajador}}{{.Trabajador.Apellido}}{{end}}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ej. Pérez Soto">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input type="email" name="email" maxlength="150" value="{{if .Trabajador}}{{.Trabajador.Email}}{{end}}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="correo@gobierno.cl">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Departamento</label>
            <select name="depto" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="0">-- Sin departamento --</option>
                {{$depID := 0}}
                {{if .Trabajador}}{{$depID = .Trabajador.Depto}}{{end}}
                {{range .Departamentos}}
                <option value="{{.IDDepto}}" {{if eq .IDDepto $depID}}selected{{end}}>{{.Descripcion}}</option>
                {{end}}
            </select>
        </div>
    </div>

    <div class="flex items-center space-x-3">
        <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-sm transition">
            {{if .Trabajador}}Guardar cambios{{else}}Crear trabajador{{end}}
        </button>
        <a href="/formularios/admin/trabajadores" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-slate-700 text-sm font-semibold rounded-lg transition">
            Cancelar
        </a>
    </div>
</form>
{{end}}
