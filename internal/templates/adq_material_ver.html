{{define "content"}}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">Material</h1>
</div>
<div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm max-w-2xl">
    <dl class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
        <div>
            <dt class="text-xs font-medium text-gray-500">Código</dt>
            <dd class="mt-1 font-mono text-slate-900">{{.Material.Codigo}}</dd>
        </div>
        <div>
            <dt class="text-xs font-medium text-gray-500">Nombre</dt>
            <dd class="mt-1 text-slate-900">{{.Material.Nombre}}</dd>
        </div>
        <div>
            <dt class="text-xs font-medium text-gray-500">Tipo de material</dt>
            <dd class="mt-1 text-slate-900">{{.Material.TipoNombre}} <span class="text-gray-400">({{.Material.Tipo}})</span></dd>
        </div>
        <div>
            <dt class="text-xs font-medium text-gray-500">Stock crítico</dt>
            <dd class="mt-1 text-slate-900">{{.Material.StockCritico}}</dd>
        </div>
    </dl>
    <div class="mt-6 flex items-center space-x-3">
        <a href="/adquisiciones/mantenedores/materiales/{{.Material.Codigo}}/editar" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg">Modificar</a>
        <a href="/adquisiciones/mantenedores/materiales" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-slate-700 text-sm font-semibold rounded-lg">Volver al listado</a>
    </div>
</div>
{{end}}
