{{define "content"}}
<div class="mb-6">
    <a href="/admin/perfiles" class="text-sm text-blue-600 hover:underline">← Volver a perfiles</a>
    <h1 class="text-2xl font-bold text-slate-900 mt-2">Nuevo perfil</h1>
</div>

<form method="post" action="/admin/perfiles" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm max-w-3xl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Nombre</label>
            <input type="text" name="nombre" required maxlength="80" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Descripción</label>
            <input type="text" name="descripcion" maxlength="200" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
        </div>
    </div>
    {{template "permisos_ambito" .}}
    <div class="flex items-center gap-3">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">Crear perfil</button>
        <a href="/admin/perfiles" class="text-sm text-gray-600 hover:text-blue-600 hover:underline">Cancelar</a>
    </div>
</form>
{{end}}
