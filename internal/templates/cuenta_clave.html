<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - Gobierno2Go</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-indigo-800 min-h-screen flex justify-center items-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-blue-900 mb-2">Cambiar contraseña</h1>
        <p class="text-gray-500 text-sm mb-6">La clave nueva debe tener al menos 6 caracteres y ser distinta de la actual. Vence a los 90 días.</p>
        {{if .Error}}
        <div class="mb-4 p-3 bg-red-50 text-red-600 border border-red-200 rounded-lg text-sm">{{.Error}}</div>
        {{end}}
        <form method="post" action="/cuenta/clave" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña actual</label>
                <input type="password" name="actual" required autocomplete="current-password" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña nueva</label>
                <input type="password" name="nueva" required minlength="6" maxlength="72" autocomplete="new-password" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Confirmar</label>
                <input type="password" name="confirma" required minlength="6" maxlength="72" autocomplete="new-password" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-900 text-white font-semibold rounded-lg hover:bg-blue-800">Guardar</button>
        </form>
        <a href="/logout" class="block text-center text-sm text-slate-500 mt-4 hover:underline">Cerrar sesión</a>
    </div>
</body>
</html>
