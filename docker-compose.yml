services:
  db:
    image: postgres:15-alpine
    container_name: gobierno_db
    environment:
      POSTGRES_DB: gobierno_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../gobierno/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gobierno_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
